name: Publicar Acervo ECOVIX
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: acervo-pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Preparar arquivos publicos
        shell: bash
        run: |
          set -euo pipefail
          mkdir _site
          cp retired/index.html retired/sw.js _site/
          touch _site/.nojekyll
          if [ -d alfa ]; then cp -R alfa _site/; fi
          if [ -d app ]; then cp -R app _site/; fi
          node -e "const fs=require('fs');for(const n of ['index.html','sw.js'])if(!fs.existsSync('_site/'+n))throw Error('Aviso de acesso desativado ausente');for(const n of ['data','release.json','release-v2.json','app.js'])if(fs.existsSync('_site/'+n))throw Error('Versao legada ainda publicada');"
          node -e "const fs=require('fs'); if(fs.existsSync('_site/alfa')){const r=JSON.parse(fs.readFileSync('_site/alfa/release.json'));for(const n of ['index.html','app.js','app.css','admin.html','admin.js','admin.css','sw.js','manifest.webmanifest',r.catalog.file])if(!fs.existsSync('_site/alfa/'+n))throw Error('Arquivo alfa ausente: '+n);if(r.version!=='0.0.1-alpha.26')throw Error('Versao alfa inesperada');}"
          node -e "const fs=require('fs');if(fs.existsSync('_site/app')){const r=JSON.parse(fs.readFileSync('_site/app/release.json'));if(r.version!=='0.1.3'||r.environment!=='production')throw Error('Versao de uso incorreta');for(const n of ['index.html','app.js','app.css','admin.html','admin.js','startup.js','sw.js','manifest.webmanifest',r.catalog.file])if(!fs.existsSync('_site/app/'+n))throw Error('Arquivo de uso ausente: '+n);}"
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar publicacao
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5


