<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; connect-src blob: data:; base-uri 'none'; form-action 'none'"><title>Modelo 3D</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#182834;color:#edf3f8;font:14px system-ui,sans-serif}#stage{position:relative;width:100%;height:100%}canvas{display:block;width:100%;height:100%;touch-action:none}#context{position:absolute;z-index:2;top:12px;right:12px;min-height:44px;border:1px solid #7d919f;border-radius:8px;padding:9px 13px;background:#203747e8;color:#e5edf3;font:inherit;cursor:pointer;box-shadow:0 2px 10px #0002}#context[aria-pressed=true]{background:#087b8b;border-color:#66c7d5;color:white}#context:focus-visible{outline:3px solid #89e4f0;outline-offset:3px}#context:disabled{display:none}#boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;color:#c7dbe7;font-size:13px;pointer-events:none}#error{position:absolute;z-index:3;inset:35% 8% auto;padding:16px;border:1px solid #ad6570;border-radius:9px;background:#502a34;color:#fff;white-space:pre-line}#error:empty{display:none}@media(max-width:600px){#context{top:10px;right:10px;font-size:12px;padding:9px 11px}}
</style></head><body><section id="stage"><canvas id="canvas" tabindex="0" aria-label="Modelo tridimensional. Um dedo gira; dois dedos movem e ajustam o zoom."></canvas><button id="context" type="button" aria-pressed="false" disabled>Estrutura existente</button><div id="boot" role="status">Carregando modelo…</div><div id="error" role="alert"></div></section><script>window.addEventListener('error',function(e){document.getElementById('boot').style.display='none';document.getElementById('error').textContent='Não foi possível iniciar o modelo: '+e.message});window.addEventListener('unhandledrejection',function(e){document.getElementById('boot').style.display='none';document.getElementById('error').textContent='Não foi possível carregar o modelo: '+String(e.reason)});</script><script src="viewer.js"></script></body></html>
